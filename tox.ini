[tox]
min_version = 4.0
env_list = lint, py313

[testenv]
runner = uv-venv-runner
description = Run unit tests with pytest
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:lint]
runner = uv-venv-runner
description = Run linting and formatting checks
deps =
    ruff
skip_install = true
commands =
    ruff check .
    ruff format --check .
