[tox]
min_version = 4.0
env_list =
    lint
    format
    mypy
    pyproject-fmt
    py313

[testenv]
runner = uv-venv-runner
description = Run unit tests with pytest
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:lint]
runner = uv-venv-runner
description = Run static linting with Ruff
deps =
    ruff
skip_install = true
commands =
    ruff check .

[testenv:format]
runner = uv-venv-runner
description = Check code formatting with Ruff
deps =
    ruff
skip_install = true
commands =
    ruff format --check .

[testenv:mypy]
runner = uv-venv-runner
description = Run static type checking with Mypy
deps =
    mypy
    types-networkx
    pytest
commands =
    mypy src tests

[testenv:pyproject-fmt]
runner = uv-venv-runner
description = Check pyproject.toml formatting
deps =
    pyproject-fmt
skip_install = true
commands =
    pyproject-fmt --check pyproject.toml
