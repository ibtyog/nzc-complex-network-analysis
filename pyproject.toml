[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "complex-networks-laboratories"
version = "0.1.0"
description = "Complex network analysis laboratories (Sieci Złożone) - New Zealand scientific collaboration network"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3",
  "typer>=0.12",
]
scripts.complex-networks = "complex_networks_laboratories.cli:app"

[dependency-groups]
dev = [
  "ipykernel>=6",
  "mypy>=2.4",
  "pyproject-fmt>=2.30.3",
  "pytest>=8",
  "ruff>=0.8",
  "tox>=4",
  "tox-uv>=1.16",
  "types-networkx>=3.6.1.20261006",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/complex_networks_laboratories" ]

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = [
  "B",  # flake8-bugbear
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = []
lint.isort.known-first-party = [ "complex_networks_laboratories" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
