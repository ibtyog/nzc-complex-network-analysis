[project]
name = "web-edu-complex-network"
version = "0.1.0"
description = "Complex network analysis of the web-edu academic hyperlink dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "scipy>=1.10.0",
    "typer>=0.12.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
web-edu = "web_edu_complex_network.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "tox>=4.0.0",
    "tox-uv>=1.16.0",
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_edu_complex_network"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["web_edu_complex_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
